name: SATUK Automated Vote Run

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website

jobs:
  run-voting-loadtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r satuk_agent/requirements.txt
          pip install openpyxl

      - name: Step 1 - Generate YAMLs for All 4 Servers (30-Min Window)
        run: |
          python satuk_agent/loadtest_gen.py --server-id 1 --csv satuk_agent/newdata.xlsx --minutes 10 --clear --nominee AECAS
          python satuk_agent/loadtest_gen.py --server-id 2 --csv satuk_agent/newdata.xlsx --minutes 10 --clear --nominee AECAS
          python satuk_agent/loadtest_gen.py --server-id 3 --csv satuk_agent/newdata.xlsx --minutes 10 --clear --nominee AECAS
          python satuk_agent/loadtest_gen.py --server-id 4 --csv satuk_agent/newdata.xlsx --minutes 10 --clear --nominee AECAS

      - name: Step 2 - Run All 4 Servers Concurrently
        run: |
          # Run all 4 server instances in the background (&) and wait for them to finish (wait)
          python satuk_agent/loadtest_run.py --server-id 1 --workers 32 --max-rps 200 --live --allow-real --no-resume --no-seek &
          python satuk_agent/loadtest_run.py --server-id 2 --workers 32 --max-rps 200 --live --allow-real --no-resume --no-seek &
          python satuk_agent/loadtest_run.py --server-id 3 --workers 32 --max-rps 200 --live --allow-real --no-resume --no-seek &
          python satuk_agent/loadtest_run.py --server-id 4 --workers 32 --max-rps 200 --live --allow-real --no-resume --no-seek &
          wait

      - name: Upload Results Logs (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vote-results-logs
          path: satuk_agent/votes_folder/results_s*.csv